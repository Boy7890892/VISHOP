<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - VISHOP</title>
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body {
            background-color: #f4f7f9;
            color: #333;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .header-logo img {
            height: 38px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(238, 77, 45, 0.2));
        }
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ee4d2d 0%, #ff7a59 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .btn-kembali {
            padding: 10px 20px;
            background: white;
            color: #ee4d2d;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid #ffe6e1;
            transition: all 0.3s ease;
        }
        .btn-kembali:hover {
            background: #fff5f3;
            border-color: #ee4d2d;
            transform: translateY(-2px);
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255,255,255,0.5);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 30px;
        }

        .profile-img-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #ff7a59 0%, #ee4d2d 100%);
            box-shadow: 0 8px 20px rgba(238, 77, 45, 0.25);
        }
        .profile-img-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            background-color: white;
        }

        .custom-file-upload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            background: #fff5f3;
            color: #ee4d2d;
            border: 1px dashed #ffb4a1;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }
        .custom-file-upload:hover {
            background: #ffe6e1;
            border-color: #ee4d2d;
        }
        .custom-file-upload input[type="file"] {
            display: none;
        }

        .input-group {
            text-align: left;
            margin-bottom: 25px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            background: #f9fafb;
            transition: all 0.3s;
            color: #333;
        }
        .input-group input:focus {
            background: #ffffff;
            border-color: #ee4d2d;
            outline: none;
            box-shadow: 0 0 0 4px rgba(238, 77, 45, 0.1);
        }

        .btn-simpan-profil {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff7a59 0%, #ee4d2d 100%);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-simpan-profil:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(238, 77, 45, 0.3);
        }
    </style>
</head>
<body>

    <header class="profile-header">
        <a href="index.html" class="header-logo">
            <img src="image/logo.svg" alt="Logo VISHOP">
            <span class="logo-text">VISHOP</span>
        </a>
        <a href="index.html" class="btn-kembali">Kembali ke Toko</a>
    </header>

    <main class="main-container">
        <div class="profile-card">
            <h2 class="profile-title">Pengaturan Profil</h2>
            
            <form id="formProfil">
                <div class="profile-img-container">
                    <img id="previewImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto Profil" class="profile-img-preview">
                </div>

                <label class="custom-file-upload">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Unggah Foto Baru
                    <input type="file" id="inputFile" accept="image/*">
                </label>
                
                <div class="input-group">
                    <label>Username Anda</label>
                    <input type="text" id="editUsername" required>
                </div>

                <button type="submit" class="btn-simpan-profil" id="btnSubmit">Simpan Perubahan</button>
            </form>
        </div>
    </main>

    <script>
        // Cek autentikasi user
        let userAktif = JSON.parse(localStorage.getItem('userVishop'));

        if (!userAktif) {
            alert("Silakan login terlebih dahulu!");
            window.location.href = 'login.html';
        }

        const inputUsername = document.getElementById('editUsername');
        const inputFile = document.getElementById('inputFile');
        const previewImg = document.getElementById('previewImg');
        const btnSubmit = document.getElementById('btnSubmit');

        // Isi form dengan data user yang sedang login
        inputUsername.value = userAktif.username;
        if (userAktif.profile_image) {
            previewImg.src = userAktif.profile_image;
        }

        let base64Image = userAktif.profile_image || '';
        const usernameLama = userAktif.username;

        // Pratinjau gambar instan saat file dipilih
        inputFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result; 
                    previewImg.src = base64Image;     
                };
                reader.readAsDataURL(file);
            }
        });

        // Kirim perubahan profil ke server backend
        document.getElementById('formProfil').addEventListener('submit', async function(e) {
            e.preventDefault();

            btnSubmit.innerText = "Menyimpan...";
            btnSubmit.style.opacity = "0.8";

            const dataBaru = {
                usernameLama: usernameLama,
                usernameBaru: inputUsername.value,
                profileImage: base64Image
            };

            try {
                const response = await fetch('http://localhost:3000/api/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataBaru)
                });

                const hasil = await response.json();

                if (response.ok) {
                    alert(hasil.message);
                    
                    // Perbarui data user di memori browser (localStorage)
                    userAktif.username = hasil.username;
                    userAktif.profile_image = hasil.profile_image;
                    localStorage.setItem('userVishop', JSON.stringify(userAktif));

                    window.location.href = 'index.html';
                } else {
                    alert(hasil.error);
                }
            } catch (error) {
                alert("Gagal terhubung ke server. Pastikan server Node.js berjalan.");
            } finally {
                btnSubmit.innerText = "Simpan Perubahan";
                btnSubmit.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
